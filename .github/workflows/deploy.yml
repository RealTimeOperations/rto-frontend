name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ] # Ya jo bhi aap ki main branch ka naam hai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Node 20 warning khatam karne ke liye explicit version

      - name: Install Dependencies & Build
        run: |
          npm install
          npm run build

      # ✅ NAYA AUR MODERN CLOUDFLARE ACTION
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 'publish' ki jagah ab 'deploy' use hota hai
          command: pages deploy dist --project-name=realtimeoperations