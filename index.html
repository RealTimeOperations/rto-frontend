<!doctype html>
<html lang="en" style="background:#021b16 !important; color-scheme:dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#021b16" />
    <title>Real Time Operations</title>
    <style>
      html, body { background: #021b16 !important; margin: 0; }
      #splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #021b16;
      }
      #splash .ring {
        width: 56px; height: 56px; border-radius: 50%;
        border: 3px solid rgba(16,185,129,0.15); border-top-color: #34d399;
        animation: splash-spin 0.9s linear infinite;
      }
      #splash .txt {
        color: rgba(255,255,255,0.55);
        font: 600 12px/1 system-ui, sans-serif;
        letter-spacing: 0.25em;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div class="ring"></div>
        <div class="txt">LOADING…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
